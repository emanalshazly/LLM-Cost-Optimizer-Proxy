name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No committed package-lock.json yet (see Dockerfile), so `npm ci`
      # isn't usable here — switch back once the lockfile is refreshed.
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build check
        run: npm run build

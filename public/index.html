<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM Cost Optimizer — Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* blue - sequential/magnitude */
    --good:           #0ca30c;
    --warning:        #fab219;
    --critical:       #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --good:           #0ca30c;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
  }
  header {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 18px; margin: 0; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .toolbar input {
    background: var(--surface-1);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }

  .timeframe-row {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }
  .timeframe-row button {
    background: var(--surface-1);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .timeframe-row button.active {
    color: var(--text-primary);
    border-color: var(--series-1);
    font-weight: 600;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .stat-tile .label {
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .stat-tile .value {
    font-size: 28px;
    font-weight: 600;
    margin-top: 6px;
    font-variant-numeric: proportional-nums;
  }
  .stat-tile .value.good { color: var(--good); }

  section {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  section h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--text-muted);
    margin: 0 0 14px 0;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 160px 1fr 60px;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .bar-row .name { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: var(--gridline); border-radius: 4px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--series-1); height: 100%; border-radius: 4px; }
  .bar-row .count { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  th { color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 11px; }
  td.prompt { font-variant-numeric: normal; color: var(--text-secondary); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .pill.hit { color: var(--good); border-color: var(--good); }

  .actions { display: flex; gap: 8px; }
  button.action {
    background: var(--surface-1);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button.action.danger { color: var(--critical); border-color: var(--critical); }

  .status-line {
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 16px;
  }
  .status-line.error { color: var(--critical); }
  .empty { color: var(--text-muted); font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>LLM Cost Optimizer — Dashboard</h1>
  <div class="toolbar">
    <input id="apiKeyInput" type="password" placeholder="x-api-key (if configured)" autocomplete="off" />
    <button class="action" id="refreshBtn">Refresh</button>
    <button class="action danger" id="clearCacheBtn">Clear cache</button>
  </div>
</header>

<main>
  <div class="status-line" id="statusLine">Loading…</div>

  <div class="timeframe-row" id="timeframeRow">
    <button data-timeframe="1h">1h</button>
    <button data-timeframe="24h" class="active">24h</button>
    <button data-timeframe="7d">7d</button>
    <button data-timeframe="30d">30d</button>
  </div>

  <div class="stat-grid">
    <div class="stat-tile">
      <div class="label">Total requests</div>
      <div class="value" id="statTotalRequests">—</div>
    </div>
    <div class="stat-tile">
      <div class="label">Cache hit rate</div>
      <div class="value" id="statCacheHitRate">—</div>
    </div>
    <div class="stat-tile">
      <div class="label">Cost saved</div>
      <div class="value good" id="statCostSaved">—</div>
    </div>
    <div class="stat-tile">
      <div class="label">Avg processing time</div>
      <div class="value" id="statAvgTime">—</div>
    </div>
  </div>

  <section>
    <h2>Model usage</h2>
    <div id="modelUsage"><div class="empty">No data yet</div></div>
  </section>

  <section>
    <h2>Recent requests</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Prompt</th>
            <th>Model</th>
            <th>Cache</th>
            <th>Cost saved</th>
            <th>Time (ms)</th>
          </tr>
        </thead>
        <tbody id="recentRequestsBody">
          <tr><td colspan="6" class="empty">No data yet</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
